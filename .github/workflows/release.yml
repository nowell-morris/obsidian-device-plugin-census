# Pushing a tag that matches manifest.json's version (e.g. 1.2.1, no "v")
# creates a GitHub release with main.js and manifest.json, which BRAT installs.
name: Release
on:
  push:
    tags: ["*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match manifest.json version
        run: test "$(jq -r .version manifest.json)" = "$GITHUB_REF_NAME"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" main.js manifest.json --title "$GITHUB_REF_NAME" --generate-notes
